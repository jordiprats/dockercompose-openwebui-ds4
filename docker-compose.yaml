services:
  ollama:
    profiles:
      - ollama
    image: ollama/ollama:rocm
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    environment:
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION_OLLAMA:-11.0.0}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - ENABLE_OPENAI_API_PASSTHROUGH=True
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    volumes:
      - ${OLLAMA_VOLUME:-/mnt/llm/ollama}:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-34607a6014e6587014a9e0e7da6a2be1bf2ae3be7fbce2325613b341337a8cf3}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - ds4
    volumes:
      - ${OPENWEBUI_VOLUME:-/mnt/llm/openwebui/backend}:/app/backend
  ds4:
    build:
      context: ./ds4
      dockerfile: Dockerfile
      args:
        DS4_REPO_URL: https://github.com/antirez/ds4
        DS4_REF: main
    container_name: ds4
    restart: unless-stopped
    environment:
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION_DS4:-11.5.1}
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    volumes:
      - ${DS4_MODEL_DIR:-/home/jprats/ds4/gguf}:/models
      - ${KV_CACHE_DIR:-/mnt/kvcache}:/kv
    ports:
      - "${DS4_PORT:-8000}:8000"
    command:
      - "-m"
      - "${DS4_MODEL:-/models/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf}"
      - "--ctx"
      - "${DS4_CTX:-100000}"
      - "--prefill-chunk"
      - "${DS4_PREFILL_CHUNK:-4096}"
      - "--kv-disk-dir"
      - "/kv/ds4-kv"
      - "--kv-disk-space-mb"
      - "${DS4_KV_DISK_SPACE_MB:-75000}"
      - "--host"
      - "${DS4_HOST:-0.0.0.0}"
      - "--port"
      - "8000"

volumes:
  ollama: {}
